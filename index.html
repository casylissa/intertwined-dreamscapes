<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Frame Composer</title>
<style>
:root{--bg:#120d1f;--panel:#1d1533;--line:#3a2b63;--acc:#8b5cf6;--tx:#ece8ff;--mut:#a79bd0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:10px}
#stage{border-radius:10px;overflow:hidden;line-height:0;background:#0b0816}
canvas{width:100%;height:auto;display:block;touch-action:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{background:#2a1f4a;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
label{display:flex;align-items:center;gap:8px;color:var(--mut);margin-top:10px;min-width:0}
label span{width:92px;flex:none;white-space:nowrap}
label b{flex:none;min-width:40px;text-align:right;color:var(--tx);font-weight:500}
input[type=range]{flex:1;min-width:0;width:100%;accent-color:var(--acc)}
.sec{margin-top:14px;color:var(--mut);font-size:13px}
.two{flex-wrap:nowrap}
.two button{flex:1 1 0;min-width:0;padding:10px 6px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.acc summary{cursor:pointer;color:var(--tx);padding:6px 0;font-weight:600;display:flex;align-items:center;justify-content:space-between;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc .t::before{content:'\25B8  '}
.acc[open] .t::before{content:'\25BE  '}
.hd{display:flex;align-items:center;justify-content:space-between}
.ic{padding:5px 7px;line-height:0;border-radius:8px;flex:none}
#bAll{display:inline-flex;align-items:center;gap:6px}
.selbar{margin-top:12px;color:var(--mut);font-size:13px}
.selbar b{color:var(--tx);font-weight:600}
.nr{padding-right:36px}
@media(min-width:900px){
.wrap{max-width:1500px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}
#stage{position:sticky;top:10px;display:flex;justify-content:center;background:#0b0816}
canvas{width:auto;max-width:100%;max-height:calc(100vh - 20px)}
.panel{margin-top:0;max-height:calc(100vh - 20px);overflow:auto}
}
.out{background:transparent;border:2px solid var(--acc);color:#d9ccff;font-weight:600}
.out:hover{background:rgba(139,92,246,.15)}
</style>
</head>
<body>
<div id="err" style="display:none;background:#5b1d2b;color:#ffd9df;padding:10px 12px;margin:10px;border-radius:8px;font:13px system-ui,sans-serif"></div>
<div class="wrap">
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="panel">
    <div class="row two">
      <button class="pri" id="bTop">Choose top image</button>
      <button class="pri" id="bBot">Choose bottom image</button>
    </div>
    <div class="selbar">Selected: <b id="selName">Top image</b></div>
    <div class="row" style="margin-top:8px">
      <button id="bFit">Fit</button>
      <button id="bFlip">Flip</button>
      <button id="bAll" title="Reset everything for the selected image"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg> Reset all</button>
    </div>
    <label><span>Zoom</span><input type="range" id="rZoom" min="20" max="400" value="100"><b id="vZoom">100%</b></label>
    <label><span>Rotate</span><input type="range" id="rRot" min="-180" max="180" value="0"><b id="vRot">0°</b></label>
    <label><span>Opacity</span><input type="range" id="rOp" min="0" max="100" value="100"><b id="vOp">100%</b></label>
    <details class="acc"><summary><span class="t">Adjust</span></summary>
      <label><span>Brightness</span><input type="range" id="a_br" min="0" max="200" value="100"><b id="v_br">100%</b></label>
      <label><span>Contrast</span><input type="range" id="a_co" min="0" max="200" value="100"><b id="v_co">100%</b></label>
      <label><span>Saturation</span><input type="range" id="a_sa" min="0" max="200" value="100"><b id="v_sa">100%</b></label>
      <label><span>Hue</span><input type="range" id="a_hu" min="-180" max="180" value="0"><b id="v_hu">0°</b></label>
      <label><span>Blur</span><input type="range" id="a_bl" min="0" max="20" value="0"><b id="v_bl">0</b></label>
    </details>
    <div class="sec">Feather border</div>
    <label class="nr"><span>Top</span><input type="range" id="rF0" min="0" max="100" value="0"><b id="vF0">0%</b></label>
    <label class="nr"><span>Bottom</span><input type="range" id="rF1" min="0" max="100" value="0"><b id="vF1">0%</b></label>
    <div class="row two" style="margin-top:14px">
      <button class="out" id="bBlank">Download blank frame</button>
      <button class="pri" id="bSave">Download PNG</button>
    </div>
  </div>
</div>
<input type="file" id="fImg" accept="image/*" hidden>

<script>
function showErr(m){const e=document.getElementById('err');e.style.display='block';e.textContent=(e.textContent?e.textContent+' | ':'')+m}
window.addEventListener('error',ev=>{if(ev.target&&ev.target.tagName==='IMG')return;showErr('Script error: '+ev.message)});
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const frame=new Image(),labImg=new Image(),bg=new Image();
const ZB=[[109, 35, 1105, 444], [155, 249, 1226, 857]];
const ZC=[[403, 224], [782, 652]];
let W=0,H=0,N=0,lab=null,zones=[],sel=0;
const tc=document.createElement('canvas'),tx=tc.getContext('2d');

function init(){
  W=cv.width=tc.width=frame.naturalWidth;H=cv.height=tc.height=frame.naturalHeight;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.drawImage(labImg,0,0,W,H);const d=x.getImageData(0,0,W,H);lab=d.data;
  for(let i=0;i<W*H;i++){const v=Math.round(lab[i*4]/100);if(v>N)N=v}
  zones=[];
  for(let k=1;k<=N;k++){
    const m=document.createElement('canvas');m.width=W;m.height=H;const mx=m.getContext('2d');
    const md=mx.createImageData(W,H);
    for(let i=0;i<W*H;i++)if(Math.round(lab[i*4]/100)===k)md.data[i*4+3]=255;
    const b=ZB[k-1],x0=b[0],y0=b[1],x1=b[2],y1=b[3];
    mx.putImageData(md,0,0);
    zones.push({mask:m,bb:{x0,y0,x1,y1},img:null,cx:0,cy:0,s:1,rot:0,op:1,fl:1,fe:0,fc:null,fk:'',br:100,co:100,sa:100,hu:0,bl:0});
  }
  ui();
}
function zoneAt(x,y){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=W||y>=H)return -1;return Math.round(lab[(y*W+x)*4]/100)-1}
const cover=z=>Math.max(Math.max(...zones.map(q=>q.bb.x1-q.bb.x0))/z.img.width,Math.max(...zones.map(q=>q.bb.y1-q.bb.y0))/z.img.height);
function src(z){
  const adj=z.br!==100||z.co!==100||z.sa!==100||z.hu!==0||z.bl>0;
  const iw=z.img.width,ih=z.img.height,sc=Math.min(1,2400/Math.max(iw,ih));
  const f=Math.round(z.fe/100*.5*Math.min(iw,ih)*sc);
  if(f<1&&!adj)return z.img;
  const k=[f,z.br,z.co,z.sa,z.hu,z.bl].join('|');if(z.fc&&z.fk===k)return z.fc;
  const w=Math.round(iw*sc),h=Math.round(ih*sc),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  if(adj&&'filter' in x){x.filter=`brightness(${z.br}%) contrast(${z.co}%) saturate(${z.sa}%) hue-rotate(${z.hu}deg) blur(${(z.bl*Math.min(w,h)/1000).toFixed(2)}px)`;x.drawImage(z.img,0,0,w,h);x.filter='none'}
  else{x.drawImage(z.img,0,0,w,h);
    if(adj){const d=x.getImageData(0,0,w,h),p=d.data,B=z.br/100,C=z.co/100,S=z.sa/100;
      for(let i=0;i<p.length;i+=4){let r=p[i]*B,g=p[i+1]*B,b=p[i+2]*B;const l=.299*r+.587*g+.114*b;
        r=l+(r-l)*S;g=l+(g-l)*S;b=l+(b-l)*S;p[i]=(r-128)*C+128;p[i+1]=(g-128)*C+128;p[i+2]=(b-128)*C+128}
      x.putImageData(d,0,0)}}
  if(f>=1){x.globalCompositeOperation='destination-in';
    let g=x.createLinearGradient(0,0,w,0);const a=Math.min(.5,f/w);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(a,'#000');g.addColorStop(1-a,'#000');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,w,h);
    g=x.createLinearGradient(0,0,0,h);const b=Math.min(.5,f/h);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(b,'#000');g.addColorStop(1-b,'#000');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,w,h)}
  z.fc=c;z.fk=k;return c}
function fit(z){const b=z.bb,w=Math.max(...zones.map(q=>q.bb.x1-q.bb.x0)),h=Math.max(...zones.map(q=>q.bb.y1-q.bb.y0)),r=z.rot*Math.PI/180,c=Math.abs(Math.cos(r)),s=Math.abs(Math.sin(r));
  z.s=Math.max((w*c+h*s)/z.img.width,(w*s+h*c)/z.img.height);z.cx=(b.x0+b.x1)/2;z.cy=(b.y0+b.y1)/2}

function render(hint=true){
  ctx.clearRect(0,0,W,H);
  zones.forEach((z,i)=>{
    tx.globalCompositeOperation='source-over';tx.clearRect(0,0,W,H);
    tx.drawImage(bg,0,0,W,H);
    if(z.img){
      tx.save();tx.globalAlpha=z.op;tx.translate(z.cx,z.cy);tx.rotate(z.rot*Math.PI/180);tx.scale(z.fl,1);
      tx.drawImage(src(z),-z.img.width*z.s/2,-z.img.height*z.s/2,z.img.width*z.s,z.img.height*z.s);tx.restore();
    }
    tx.globalCompositeOperation='destination-in';tx.drawImage(z.mask,0,0);
    ctx.drawImage(tc,0,0);
  });
  ctx.drawImage(frame,0,0);
  if(hint){
    const k=W/cv.getBoundingClientRect().width;
    zones.forEach((z,i)=>{
      if(z.img&&i!==sel)return;
      const [cx,cy]=ZC[i];
      if(!z.img){const r=34*k,p=14*k;ctx.save();ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2.5*k;ctx.setLineDash([7*k,6*k]);ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(cx-p,cy);ctx.lineTo(cx+p,cy);ctx.moveTo(cx,cy-p);ctx.lineTo(cx,cy+p);ctx.stroke();ctx.restore()}
    });
  }
}
function ui(){
  const z=zones[sel];
  $('#selName').textContent=sel===0?'Top image':'Bottom image';
  const has=!!(z&&z.img);
  document.querySelectorAll('.rb').forEach(b=>b.disabled=!has);
  ['rZoom','rRot','rOp'].forEach(id=>$('#'+id).disabled=!has);
  ADJ.forEach(([k,u])=>{const e=$('#a_'+k);e.disabled=!has;e.value=has?z[k]:e.defaultValue;$('#v_'+k).textContent=e.value+u});
  [0,1].forEach(i=>{const q=zones[i];$('#rF'+i).disabled=!(q&&q.img);$('#rF'+i).value=q?q.fe:0;$('#vF'+i).textContent=(q?q.fe:0)+'%'});
  if(has){
    $('#rZoom').value=Math.round(z.s/cover(z)*100);$('#rRot').value=z.rot;$('#rOp').value=Math.round(z.op*100);
  }
  $('#vZoom').textContent=$('#rZoom').value+'%';$('#vRot').textContent=$('#rRot').value+'°';$('#vOp').textContent=$('#rOp').value+'%';
  render();
}
const ADJ=[['br','%'],['co','%'],['sa','%'],['hu','°'],['bl','']];
ADJ.forEach(([k,u])=>$('#a_'+k).oninput=e=>{const z=zones[sel];if(!z||!z.img)return;z[k]=+e.target.value;$('#v_'+k).textContent=e.target.value+u;render()});
const ADJ0={br:100,co:100,sa:100,hu:0,bl:0};
const withImg=fn=>e=>{if(e){e.preventDefault();e.stopPropagation()}const z=zones[sel];if(z&&z.img){fn(z);ui()}};
const IC='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';
const RS={rZoom:z=>{const x=z.cx,y=z.cy;fit(z);z.cx=x;z.cy=y},rRot:z=>{z.rot=0},rOp:z=>{z.op=1},a_br:z=>{z.br=100},a_co:z=>{z.co=100},a_sa:z=>{z.sa=100},a_hu:z=>{z.hu=0},a_bl:z=>{z.bl=0}};
Object.entries(RS).forEach(([id,fn])=>{const b=document.createElement('button');b.className='ic rb';b.title='Reset';b.innerHTML=IC;b.onclick=withImg(fn);$('#'+id).closest('label').appendChild(b)});
$('#bAll').onclick=withImg(z=>{Object.assign(z,ADJ0);z.fe=0;z.rot=0;z.fl=1;z.op=1;fit(z)});
let pickIdx=0;
const pick=i=>{pickIdx=sel=i;ui();$('#fImg').click()};
$('#bTop').onclick=()=>pick(0);$('#bBot').onclick=()=>pick(1);
$('#fImg').onchange=e=>{const f=e.target.files[0];e.target.value='';load(pickIdx,f)};
function load(i,f){if(!f||!f.type.startsWith('image/'))return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const z=zones[i];z.img=im;z.fc=null;Object.assign(z,{br:100,co:100,sa:100,hu:0,bl:0});z.rot=0;z.fl=1;fit(z);sel=i;ui()};im.src=r.result};r.readAsDataURL(f)}
$('#rZoom').oninput=e=>{const z=zones[sel];z.s=e.target.value/100*cover(z);$('#vZoom').textContent=e.target.value+'%';render()};
$('#rRot').oninput=e=>{zones[sel].rot=+e.target.value;$('#vRot').textContent=e.target.value+'°';render()};
$('#rOp').oninput=e=>{zones[sel].op=e.target.value/100;$('#vOp').textContent=e.target.value+'%';render()};
$('#bSave').onclick=()=>{render(false);cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='framed.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);render()},'image/png')};

[0,1].forEach(i=>$('#rF'+i).oninput=e=>{const q=zones[i];if(!q||!q.img)return;q.fe=+e.target.value;$('#vF'+i).textContent=q.fe+'%';render()});
$('#bFit').onclick=()=>{const z=zones[sel];if(z&&z.img){fit(z);ui()}};
$('#bFlip').onclick=()=>{const z=zones[sel];if(z&&z.img){z.fl*=-1;render()}};
$('#bBlank').onclick=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(frame,0,0,W,H);
  c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='blank-frame.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)},'image/png')};
/* kéo / chụm */
const ptrs=new Map();let drag=null,moved=false;
function pos(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
const d2=()=>{const [a,b]=[...ptrs.values()];return Math.hypot(a[0]-b[0],a[1]-b[1])};
cv.onpointerdown=e=>{
  cv.setPointerCapture(e.pointerId);const [x,y]=pos(e);ptrs.set(e.pointerId,[x,y]);moved=false;
  if(ptrs.size===2&&zones[sel].img){drag={t:'pinch',d0:d2(),s0:zones[sel].s};return}
  const i=zoneAt(x,y);if(i<0){drag=null;return}
  if(i!==sel){sel=i;ui()}
  const z=zones[i];drag=z.img?{t:'pan',sx:x,sy:y,c0:[z.cx,z.cy]}:{t:'tap'};
};
cv.onpointermove=e=>{
  if(!ptrs.has(e.pointerId))return;const [x,y]=pos(e);ptrs.set(e.pointerId,[x,y]);if(!drag)return;
  const z=zones[sel];moved=true;
  if(drag.t==='pan'){z.cx=drag.c0[0]+x-drag.sx;z.cy=drag.c0[1]+y-drag.sy}
  else if(drag.t==='pinch'&&ptrs.size>=2)z.s=Math.max(.001,drag.s0*d2()/drag.d0);
  render();
};
const up=e=>{ptrs.delete(e.pointerId);
  if(drag&&drag.t==='tap'&&!moved){pickIdx=sel;$('#fImg').click()}
  if(!ptrs.size){drag=null;ui()}};
cv.onpointerup=up;cv.onpointercancel=up;
cv.onwheel=e=>{const z=zones[sel];if(!z||!z.img)return;e.preventDefault();z.s*=Math.exp(-e.deltaY*.001);ui()};
cv.ondragover=e=>e.preventDefault();
cv.ondrop=e=>{e.preventDefault();const [x,y]=pos(e),i=zoneAt(x,y);if(i>=0)load(i,e.dataTransfer.files[0])};
window.onresize=()=>render();

let n=0;const done=()=>{if(++n===3)init()};

$('#bTop').onclick=()=>pick(0);$('#bBot').onclick=()=>pick(1);

function load(i,f){if(!f||!f.type.startsWith('image/'))return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const z=zones[i];z.img=im;z.fc=null;Object.assign(z,{br:100,co:100,sa:100,hu:0,bl:0});z.rot=0;z.fl=1;fit(z);sel=i;ui()};im.src=r.result};r.readAsDataURL(f)}

$('#rOp').oninput=e=>{zones[sel].op=e.target.value/100;$('#vOp').textContent=e.target.value+'%';render()};

const ptrs=new Map();let drag=null,moved=false;
function pos(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
const d2=()=>{const [a,b]=[...ptrs.values()];return Math.hypot(a[0]-b[0],a[1]-b[1])};
cv.onpointerdown=e=>{
  cv.setPointerCapture(e.pointerId);const [x,y]=pos(e);ptrs.set(e.pointerId,[x,y]);moved=false;
  if(ptrs.size===2&&zones[sel].img){drag={t:'pinch',d0:d2(),s0:zones[sel].s};return}
  const i=zoneAt(x,y);if(i<0){drag=null;return}
  if(i!==sel){sel=i;ui()}
  const z=zones[i];drag=z.img?{t:'pan',sx:x,sy:y,c0:[z.cx,z.cy]}:{t:'tap'};
};
cv.onpointermove=e=>{
  if(!ptrs.has(e.pointerId))return;const [x,y]=pos(e);ptrs.set(e.pointerId,[x,y]);if(!drag)return;
  const z=zones[sel];moved=true;
  if(drag.t==='pan'){z.cx=drag.c0[0]+x-drag.sx;z.cy=drag.c0[1]+y-drag.sy}
  else if(drag.t==='pinch'&&ptrs.size>=2)z.s=Math.max(.001,drag.s0*d2()/drag.d0);
  render();
};
const up=e=>{ptrs.delete(e.pointerId);
  if(drag&&drag.t==='tap'&&!moved){pickIdx=sel;$('#fImg').click()}
  if(!ptrs.size){drag=null;ui()}};
cv.onpointerup=up;cv.onpointercancel=up;
cv.onwheel=e=>{const z=zones[sel];if(!z||!z.img)return;e.preventDefault();z.s*=Math.exp(-e.deltaY*.001);ui()};
cv.ondragover=e=>e.preventDefault();
cv.ondrop=e=>{e.preventDefault();const [x,y]=pos(e),i=zoneAt(x,y);if(i>=0)load(i,e.dataTransfer.files[0])};
window.onresize=()=>render();
