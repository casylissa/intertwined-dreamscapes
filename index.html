<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f7fb;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
      text-align: center;
      max-width: 460px;
      width: 100%;
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background-color: #3b82f6;
      border-radius: 50%;
      margin-bottom: 18px;
      animation: pulse 1.8s infinite ease-in-out;
    }
    h1 {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.6;
      color: #0f172a;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="dot"></span>
    <h1>Website is currently being updated. Please check back after 12:00 PM (UTC+7) on Nov 24.</h1>
  </div>
</body>
</html>
